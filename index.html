<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carta Digital & Pedidos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body id="app-body" class="bg-stone-50 text-stone-800 pb-28 transition-colors duration-300">

  <!-- Barra de Control Demo (Para cambiar entre Versión 1, 2, 3 y abrir Cocina) -->
  <div class="bg-neutral-950 text-white text-xs py-2 px-4 border-b border-neutral-800">
    <div class="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-1.5">
        <span class="text-neutral-400 font-semibold mr-1">Diseño:</span>
        <button onclick="cambiarVersion(1)" id="btn-v1" class="px-2.5 py-1 rounded font-bold transition">V1 Clásico</button>
        <button onclick="cambiarVersion(2)" id="btn-v2" class="px-2.5 py-1 rounded font-bold transition">V2 Dark Burger</button>
        <button onclick="cambiarVersion(3)" id="btn-v3" class="px-2.5 py-1 rounded font-bold transition">V3 Minimal Lista</button>
      </div>
      <a href="pedidos.html" target="_blank" class="inline-flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 py-1 rounded transition">
        <i class="fa-solid fa-fire-burner"></i> Abrir Pantalla Pedidos
      </a>
    </div>
  </div>

  <!-- Contenedor dinámico del Header según la versión -->
  <div id="header-container"></div>

  <!-- Filtro de Categorías Sticky -->
  <nav id="nav-categorias" class="sticky top-0 z-30 backdrop-blur border-b transition-colors">
    <div id="categorias-container" class="max-w-4xl mx-auto px-4 py-3 flex gap-2 overflow-x-auto no-scrollbar"></div>
  </nav>

  <!-- Listado de Platos -->
  <main class="max-w-4xl mx-auto px-4 mt-6">
    <div id="menu-grid"></div>
  </main>

  <!-- Barra Flotante del Pedido -->
  <div id="barra-carrito" class="hidden fixed bottom-4 inset-x-0 z-40 px-4">
    <div class="max-w-4xl mx-auto">
      <button id="btn-ver-carrito" onclick="abrirModalCarrito()" class="w-full font-bold py-3.5 px-5 rounded-2xl shadow-xl flex items-center justify-between transition transform active:scale-98">
        <div class="flex items-center gap-3">
          <span id="carrito-cantidad" class="text-xs font-extrabold px-2.5 py-1 rounded-lg">0</span>
          <span>Ver mi pedido</span>
        </div>
        <span id="carrito-total" class="text-lg font-extrabold">$0</span>
      </button>
    </div>
  </div>

  <!-- Modal Resumen y Envío a Cocina -->
  <div id="modal-carrito" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white text-stone-900 w-full max-w-lg rounded-t-3xl sm:rounded-2xl p-6 max-h-[90vh] overflow-y-auto shadow-2xl">
      <div class="flex items-center justify-between border-b pb-3">
        <h2 class="text-xl font-extrabold">Confirmar Pedido</h2>
        <button onclick="cerrarModalCarrito()" class="text-stone-400 hover:text-stone-700 text-xl p-1"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div id="lista-carrito" class="divide-y divide-stone-100 my-4 max-h-56 overflow-y-auto"></div>

      <!-- Datos del Cliente -->
      <div class="space-y-3 bg-stone-50 p-4 rounded-xl border border-stone-200 text-sm">
        <div>
          <label class="font-semibold block mb-1">¿Cómo recibes tu pedido?</label>
          <select id="tipo-entrega" onchange="toggleDireccion()" class="w-full rounded-lg border-stone-300 border p-2 bg-white">
            <option value="En mesa">Estoy en una mesa del local</option>
            <option value="Retiro en local">Retiro en el local</option>
            <option value="Delivery">Delivery a domicilio</option>
          </select>
        </div>
        <div id="campo-direccion">
          <label id="label-direccion" class="font-semibold block mb-1">N° de Mesa</label>
          <input id="cliente-direccion" type="text" placeholder="Ej: Mesa 4" class="w-full rounded-lg border-stone-300 border p-2 bg-white">
        </div>
        <div>
          <label class="font-semibold block mb-1">Tu Nombre</label>
          <input id="cliente-nombre" type="text" placeholder="Ej: Martín" class="w-full rounded-lg border-stone-300 border p-2 bg-white">
        </div>
        <div>
          <label class="font-semibold block mb-1">Nota para cocina (opcional)</label>
          <input id="cliente-nota" type="text" placeholder="Ej: Sin cebolla, punto medio..." class="w-full rounded-lg border-stone-300 border p-2 bg-white">
        </div>
      </div>

      <div class="flex items-center justify-between font-extrabold text-lg mt-4 pt-3 border-t">
        <span>Total a pagar:</span>
        <span id="modal-total" class="text-amber-600">$0</span>
      </div>

      <button onclick="enviarPedidoACocina()" class="mt-4 w-full bg-stone-900 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl shadow-lg flex items-center justify-center gap-2 text-base transition">
        <i class="fa-solid fa-paper-plane"></i> Enviar Pedido a Cocina
      </button>
    </div>
  </div>

  <!-- Toast de Confirmación cuando se envía el pedido -->
  <div id="toast-exito" class="hidden fixed top-16 inset-x-4 z-50 max-w-md mx-auto bg-emerald-600 text-white p-4 rounded-2xl shadow-2xl flex items-center gap-3">
    <i class="fa-solid fa-circle-check text-2xl"></i>
    <div>
      <p class="font-extrabold text-sm">¡Pedido enviado a cocina!</p>
      <p id="toast-numero" class="text-xs text-emerald-100">Orden #001 recibida en pantalla.</p>
    </div>
  </div>

  <footer class="max-w-4xl mx-auto px-4 mt-12 text-center text-xs opacity-60">
    <p>Carta digital desarrollada por <strong>Martín Garriga</strong> • Sistema en tiempo real</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
