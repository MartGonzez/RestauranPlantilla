<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor de Pedidos en Vivo | Cocina</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- Barra Superior del Monitor -->
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-amber-500 text-slate-950 flex items-center justify-center font-black text-lg">
        <i class="fa-solid fa-fire-burner"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-lg font-extrabold tracking-tight">Monitor de Cocina</h1>
          <span class="inline-flex items-center gap-1.5 text-xs font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> En vivo
          </span>
        </div>
        <p id="subtitulo-local" class="text-xs text-slate-400">Recepción automática de pedidos</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <span id="reloj-vivo" class="font-mono text-lg font-bold text-slate-300 bg-slate-800 px-3 py-1.5 rounded-lg">00:00:00</span>
      <button onclick="limpiarPedidosCompletados()" class="text-xs bg-slate-800 hover:bg-red-950 hover:text-red-300 text-slate-300 border border-slate-700 px-3 py-2 rounded-lg font-semibold transition">
        <i class="fa-solid fa-trash-can mr-1"></i> Limpiar historial
      </button>
    </div>
  </header>

  <!-- Tablero Kanban de 3 Columnas -->
  <main class="flex-1 p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-7xl w-full mx-auto">

    <!-- Columna 1: Nuevos -->
    <section class="bg-slate-900/70 rounded-2xl border border-slate-800 flex flex-col overflow-hidden">
      <div class="p-4 border-b border-slate-800 bg-amber-500/10 flex items-center justify-between">
        <h2 class="font-extrabold text-amber-400 flex items-center gap-2">
          <i class="fa-solid fa-bell"></i> Nuevos Pedidos
        </h2>
        <span id="count-nuevo" class="bg-amber-500 text-slate-950 text-xs font-black px-2.5 py-0.5 rounded-full">0</span>
      </div>
      <div id="col-nuevo" class="p-4 space-y-4 flex-1 overflow-y-auto"></div>
    </section>

    <!-- Columna 2: En Preparación -->
    <section class="bg-slate-900/70 rounded-2xl border border-slate-800 flex flex-col overflow-hidden">
      <div class="p-4 border-b border-slate-800 bg-sky-500/10 flex items-center justify-between">
        <h2 class="font-extrabold text-sky-400 flex items-center gap-2">
          <i class="fa-solid fa-kitchen-set"></i> En Preparación
        </h2>
        <span id="count-preparando" class="bg-sky-500 text-slate-950 text-xs font-black px-2.5 py-0.5 rounded-full">0</span>
      </div>
      <div id="col-preparando" class="p-4 space-y-4 flex-1 overflow-y-auto"></div>
    </section>

    <!-- Columna 3: Listos -->
    <section class="bg-slate-900/70 rounded-2xl border border-slate-800 flex flex-col overflow-hidden">
      <div class="p-4 border-b border-slate-800 bg-emerald-500/10 flex items-center justify-between">
        <h2 class="font-extrabold text-emerald-400 flex items-center gap-2">
          <i class="fa-solid fa-check-double"></i> Listos / Entregados
        </h2>
        <span id="count-listo" class="bg-emerald-500 text-slate-950 text-xs font-black px-2.5 py-0.5 rounded-full">0</span>
      </div>
      <div id="col-listo" class="p-4 space-y-4 flex-1 overflow-y-auto"></div>
    </section>

  </main>

  <script src="js/data.js"></script>
  <script src="js/pedidos.js"></script>
</body>
</html>
